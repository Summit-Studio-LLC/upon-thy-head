name: upon_thy_head
description: "Upon Thy Head. A written record of priesthood blessings, kept on the device."
publish_to: 'none'
version: 1.1.0+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  # liquid glass for the home's capsule, its menu and the icon group (home/home_screen.dart); pinned
  # exactly, the package changes fast
  liquid_glass_widgets: 1.17.5
  # the package draws a few of its own glyphs from this font
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # true for one glyph: the "more" button of Android's own copy and paste menu (review_screen.dart).
  # Release builds keep only the glyphs used, a few kilobytes.
  uses-material-design: true

  assets:
    - assets/sky/stars.bin
    - assets/sky/named.json
    - assets/sky/constellations.json
    - assets/sky/milkyway_4k.jpg
    - assets/sky/milkyway_soft.png
    # the app switcher's cover (tool/cover_shot.sh)
    - assets/sky/cover.jpg

  shaders:
    - shaders/sky.frag
    - shaders/light.frag

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic

# SQLite: the build package:sqlite3 bundles with the app (compiled from upstream SQLite and checked
# against the sha256 sums published with the package), on every platform. Android does not let an
# app load the system's own SQLite, and the package's choice is one for the whole project, so iOS
# and macOS use the bundled build too (docs/android-plan.md 8.1). The database file is the same
# SQLite format either way: an install made with the system's SQLite opens unchanged.
